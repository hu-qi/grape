apiVersion: v1
kind: Service
metadata:
  name: grape-mysql
  namespace: aidev
  labels:
    app: grape-mysql
spec:
  selector:
    app: grape-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grape-mysql
  namespace: aidev
  labels:
    app: grape-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grape-mysql
  template:
    metadata:
      labels:
        app: grape-mysql
    spec:
      containers:
        - name: mysql
          image: docker.m.daocloud.io/library/mysql:8.0.36
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grape-mysql-auth
                  key: root-password
            - name: MYSQL_DATABASE
              value: grape
            - name: MYSQL_USER
              value: grape
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grape-mysql-auth
                  key: app-password
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grape-mysql-data
